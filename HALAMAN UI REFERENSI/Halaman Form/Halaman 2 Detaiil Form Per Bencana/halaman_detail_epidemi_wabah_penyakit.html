<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Form Pelaporan: Detail Epidemi / Wabah</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "secondary-fixed-dim": "#c4c5d6",

                        "on-error": "#ffffff",
                        "inverse-primary": "#ffb86e",
                        "background": "#f9f9f9",
                        "tertiary-fixed-dim": "#c5c6ce",
                        "tertiary-fixed": "#e2e2eb",
                        "surface-dim": "#dadada",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#e2e2e2",
                        "surface-container-low": "#f3f3f3",

                    },
                    "borderRadius": {

                        "unit": "4px",

                        "panel-width": "360px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],

                        "body-lg": ["Inter"],

                        "data-mono": ["13px", {"lineHeight": "1.2", "fontWeight": "400"}],

                        "body-md": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],

                },
            },
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9f9;
        }
        .form-card {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e2e2;
        }
        .custom-checkbox:checked + label {
            border-color: #F39200;
            background-color: rgba(243, 146, 0, 0.05);
        }
        .custom-radio:checked + label {
            border-color: #F39200;
            background-color: rgba(243, 146, 0, 0.05);
        }
    </style>
</head>
<body class="bg-background text-on-surface">
<!-- TopNavBar -->
<header class="bg-[#1C1F2B]/85 backdrop-blur-md fixed top-0 w-full z-50 border-b border-white/10 shadow-[0_4px_20px_rgba(0,0,0,0.15)]">
<div class="flex justify-between items-center px-6 py-3 w-full max-w-full">
<div class="flex items-center gap-4">
<span class="text-xl font-black text-white tracking-tighter">GIS Epidemic Watch</span>
<nav class="hidden md:flex gap-6 ml-8">
<a class="font-['Inter'] text-sm font-semibold tracking-tight text-white/70 hover:text-white transition-colors" href="#">Dashboard</a>
<a class="font-['Inter'] text-sm font-semibold tracking-tight text-[#F39200] border-b-2 border-[#F39200] pb-1" href="#">Reports</a>
<a class="font-['Inter'] text-sm font-semibold tracking-tight text-white/70 hover:text-white transition-colors" href="#">Analytics</a>
</nav>
</div>
<div class="flex items-center gap-4 text-white">
<button class="p-2 hover:bg-white/5 rounded-md transition-all active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<button class="p-2 hover:bg-white/5 rounded-md transition-all active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</div>
</header>
<main class="pt-24 pb-32 px-4 flex justify-center">
<div class="w-full max-w-[700px]">
<!-- Stepper -->
<div class="flex items-center justify-between mb-8 px-2">
<div class="flex items-center gap-2">
<span class="w-8 h-8 rounded-full bg-primary-container text-white flex items-center justify-center font-bold text-sm">2</span>
<span class="font-headline-md text-headline-md text-on-surface">Step 2 of 4</span>
</div>
<div class="text-on-surface-variant font-body-md text-body-md">Detail Epidemi / Wabah</div>
</div>
<div class="bg-surface-container-lowest rounded-xl p-8 form-card">
<h1 class="font-headline-lg text-headline-lg mb-2 text-on-surface">Form Pelaporan: Detail Epidemi / Wabah</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-8">Lengkapi data dugaan epidemi untuk koordinasi penanganan cepat.</p>
<form class="space-y-10">
<!-- Section 1 -->
<section class="space-y-4">
<label class="block font-label-bold text-label-bold uppercase text-on-surface-variant">1. JENIS DUGAAN PENYAKIT / GEJALA DOMINAN *</label>
<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
<div class="relative">
<input class="sr-only custom-checkbox" id="gejala1" name="gejala" type="checkbox"/>
<label class="flex flex-col p-4 border border-outline-variant rounded-lg cursor-pointer hover:border-primary-container transition-all h-full" for="gejala1">
<span class="font-headline-md text-headline-md text-on-surface mb-1">Pernapasan</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Batuk, Sesak Napas</span>
</label>
</div>
<div class="relative">
<input class="sr-only custom-checkbox" id="gejala2" name="gejala" type="checkbox"/>
<label class="flex flex-col p-4 border border-outline-variant rounded-lg cursor-pointer hover:border-primary-container transition-all h-full" for="gejala2">
<span class="font-headline-md text-headline-md text-on-surface mb-1">Pencernaan</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Diare Massal, Muntah</span>
</label>
</div>
<div class="relative">
<input class="sr-only custom-checkbox" id="gejala3" name="gejala" type="checkbox"/>
<label class="flex flex-col p-4 border border-outline-variant rounded-lg cursor-pointer hover:border-primary-container transition-all h-full" for="gejala3">
<span class="font-headline-md text-headline-md text-on-surface mb-1">Kulit</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Gatal-gatal, Ruam, Melepuh</span>
</label>
</div>
<div class="relative">
<input class="sr-only custom-checkbox" id="gejala4" name="gejala" type="checkbox"/>
<label class="flex flex-col p-4 border border-outline-variant rounded-lg cursor-pointer hover:border-primary-container transition-all h-full" for="gejala4">
<span class="font-headline-md text-headline-md text-on-surface mb-1">Demam Tinggi Menyebar</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Dugaan DBD/Malaria/Tipus</span>
</label>
</div>
<div class="relative">
<input class="sr-only custom-checkbox" id="gejala5" name="gejala" type="checkbox"/>
<label class="flex flex-col p-4 border border-outline-variant rounded-lg cursor-pointer hover:border-primary-container transition-all h-full" for="gejala5">
<span class="font-headline-md text-headline-md text-on-surface mb-1">Keracunan</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Konsumsi Makanan Massal</span>
</label>
</div>
<div class="relative">
<input class="sr-only custom-checkbox" id="gejala_lain_toggle" name="gejala" type="checkbox"/>
<label class="flex flex-col p-4 border border-outline-variant rounded-lg cursor-pointer hover:border-primary-container transition-all h-full" for="gejala_lain_toggle">
<span class="font-headline-md text-headline-md text-on-surface mb-1">Yang lain</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Sebutkan gejala lainnya</span>
</label>
</div>
</div>
<input class="w-full mt-2 p-3 border border-outline-variant rounded-lg font-body-md focus:ring-1 focus:ring-primary-container focus:border-primary-container outline-none bg-surface-container-low transition-all" name="gejala_lain" placeholder="Sebutkan gejala spesifik lainnya..." type="text"/>
</section>
<!-- Section 2 -->
<section class="space-y-4">
<label class="block font-label-bold text-label-bold uppercase text-on-surface-variant">2. JUMLAH WARGA BERGEJALA (ESTIMASI: Isi dengan jumlah orrang yang menunjukkan gelaja serupa)*</label>
<div class="relative max-w-[240px]">
<input class="w-full p-4 border border-outline-variant rounded-lg font-headline-md focus:ring-1 focus:ring-primary-container focus:border-primary-container outline-none bg-surface-container-low" name="jumlah_warga" placeholder="0" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-label-bold">ORANG</span>
</div>
</section>
<!-- Section 3 -->
<section class="space-y-4">
<label class="block font-label-bold text-label-bold uppercase text-on-surface-variant">3. SEBARAN LOKASI TERDAMPAK *</label>
<div class="space-y-2">
<input class="sr-only custom-radio" id="sebaran1" name="sebaran" type="radio"/>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:border-primary-container transition-all" for="sebaran1">
<span class="font-body-md text-on-surface">Terfokus di satu RT/RW saja</span>
</label>
<input class="sr-only custom-radio" id="sebaran2" name="sebaran" type="radio"/>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:border-primary-container transition-all" for="sebaran2">
<span class="font-body-md text-on-surface">Tersebar di satu Desa/Kelurahan</span>
</label>
<input class="sr-only custom-radio" id="sebaran3" name="sebaran" type="radio"/>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:border-primary-container transition-all" for="sebaran3">
<span class="font-body-md text-on-surface">Lintas Kecamatan</span>
</label>
<input class="sr-only custom-radio" id="sebaran4" name="sebaran" type="radio"/>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:border-primary-container transition-all" for="sebaran4">
<span class="font-body-md text-on-surface">Lokasi Khusus (Sekolah, Pondok Pesantren, Perkantoran)</span>
</label>
<input class="sr-only custom-radio" id="sebaran_lain_toggle" name="sebaran" type="radio"/>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:border-primary-container transition-all" for="sebaran_lain_toggle">
<span class="font-body-md text-on-surface">Yang lain</span>
</label>
</div>
<input class="w-full mt-2 p-3 border border-outline-variant rounded-lg font-body-md focus:ring-1 focus:ring-primary-container focus:border-primary-container outline-none bg-surface-container-low transition-all" name="sebaran_lain" placeholder="Tuliskan lokasi spesifik..." type="text"/>
</section>
<!-- Section 4 -->
<section class="space-y-4">
<label class="block font-label-bold text-label-bold uppercase text-on-surface-variant">4. FASILITAS KESEHATAN YANG MENANGANI *</label>
<div class="space-y-2">
<input class="sr-only custom-radio" id="faskes1" name="faskes" type="radio"/>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:border-primary-container transition-all" for="faskes1">
<span class="font-body-md text-on-surface">Puskesmas</span>
</label>
<input class="sr-only custom-radio" id="faskes2" name="faskes" type="radio"/>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:border-primary-container transition-all" for="faskes2">
<span class="font-body-md text-on-surface">Bidan Desa / Mantri</span>
</label>
<input class="sr-only custom-radio" id="faskes3" name="faskes" type="radio"/>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:border-primary-container transition-all" for="faskes3">
<span class="font-body-md text-on-surface">Rumah Sakit Umum Daerah (RSUD)</span>
</label>
<input class="sr-only custom-radio" id="faskes4" name="faskes" type="radio"/>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:border-primary-container transition-all" for="faskes4">
<span class="font-body-md text-error font-semibold">Belum ada penanganan medis sama sekali</span>
</label>
</div>
</section>
<!-- Section 5 -->
<section class="space-y-4">
<label class="block font-label-bold text-label-bold uppercase text-on-surface-variant">5. KONDISI SANITASI &amp; SUMBER AIR *</label>
<div class="space-y-2">
<input class="sr-only custom-radio" id="sanitasi1" name="sanitasi" type="radio"/>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:border-primary-container transition-all" for="sanitasi1">
<span class="font-body-md text-on-surface">Layak / Bersih</span>
</label>
<input class="sr-only custom-radio" id="sanitasi2" name="sanitasi" type="radio"/>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:border-primary-container transition-all" for="sanitasi2">
<span class="font-body-md text-on-surface">Tercemar (Dugaan sumber penularan)</span>
</label>
<input class="sr-only custom-radio" id="sanitasi3" name="sanitasi" type="radio"/>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:border-primary-container transition-all" for="sanitasi3">
<span class="font-body-md text-on-surface">Sanitasi Buruk (Drainase mampet/Sampah menumpuk)</span>
</label>
</div>
</section>
<!-- Section 6 -->
<section class="space-y-4">
<label class="block font-label-bold text-label-bold uppercase text-on-surface-variant">6. RIWAYAT KEJADIAN (KRONOLOGI SINGKAT) *</label>
<textarea class="w-full p-4 border border-outline-variant rounded-lg font-body-md focus:ring-1 focus:ring-primary-container focus:border-primary-container outline-none bg-surface-container-low" name="kronologi" placeholder="Jelaskan bagaimana gejala awal muncul dan perkembangan penyebaran di lingkungan tersebut..." rows="4"></textarea>
</section>
<!-- Form Actions -->
<div class="pt-8 flex flex-col md:flex-row gap-4 border-t border-outline-variant">
<button class="flex-1 py-4 border-2 border-primary-container text-primary-container font-headline-md rounded-xl hover:bg-primary-fixed-dim transition-all active:scale-95" type="button">KEMBALI</button>
<button class="flex-[2] py-4 bg-primary-container text-white font-headline-md rounded-xl hover:bg-[#D98200] transition-all active:scale-95 shadow-lg shadow-primary-container/20" type="submit">LANJUTKAN (STEP 3)</button>
</div>
</form>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-white dark:bg-[#1C1F2B] border-t border-slate-200 dark:border-white/10 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] md:hidden">
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-[#F39200] transition-transform active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="map">map</span>
<span class="font-['Inter'] text-[10px] font-bold uppercase tracking-widest mt-1">Map</span>
</a>
<a class="flex flex-col items-center justify-center text-[#F39200] scale-110 active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined text-3xl" data-icon="add_circle">add_circle</span>
<span class="font-['Inter'] text-[10px] font-bold uppercase tracking-widest mt-1">Report</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-[#F39200] transition-transform active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="warning">warning</span>
<span class="font-['Inter'] text-[10px] font-bold uppercase tracking-widest mt-1">Alerts</span>
</a>
</nav>
</body></html>
