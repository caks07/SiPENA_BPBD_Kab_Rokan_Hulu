<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Disaster Response - Report Karhutla</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#5d5e65",
                        "on-background": "#1a1c1c",
                        "secondary-fixed": "#e0e1f2",
                        "surface-tint": "#8a5100",
                        "on-error": "#ffffff",
                        "primary-container": "#f39200",
                        "on-secondary-fixed-variant": "#434654",
                        "inverse-on-surface": "#f1f1f1",
                        "secondary-fixed-dim": "#c4c5d6",
                        "on-error-container": "#93000a",
                        "surface": "#f9f9f9",
                        "on-primary-container": "#5c3400",
                        "surface-container-low": "#f3f3f3",
                        "surface-container": "#eeeeee",
                        "on-secondary-container": "#5f6270",
                        "inverse-primary": "#ffb86e",
                        "on-tertiary": "#ffffff",
                        "secondary": "#5b5e6c",
                        "inverse-surface": "#2f3131",
                        "surface-dim": "#dadada",
                        "surface-container-highest": "#e2e2e2",
                        "secondary-container": "#dddfef",
                        "on-secondary-fixed": "#181b27",
                        "on-tertiary-container": "#3c3d44",
                        "surface-variant": "#e2e2e2",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#c5c6ce",
                        "primary": "#8a5100",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#544434",
                        "on-primary-fixed": "#2c1600",
                        "surface-bright": "#f9f9f9",
                        "surface-container-high": "#e8e8e8",
                        "outline-variant": "#dac2ae",
                        "on-tertiary-fixed-variant": "#45464e",
                        "on-primary-fixed-variant": "#693c00",
                        "on-surface": "#1a1c1c",
                        "tertiary-fixed": "#e2e2eb",
                        "tertiary-container": "#a8a8b1",
                        "on-primary": "#ffffff",
                        "outline": "#877362",
                        "on-tertiary-fixed": "#191b22",
                        "background": "#f9f9f9",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#ffb86e",
                        "primary-fixed": "#ffdcbd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "xs": "4px",
                        "unit": "4px",
                        "xl": "32px",
                        "navbar-height": "64px",
                        "sm": "8px",
                        "panel-width": "360px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "label-bold": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "data-mono": ["monospace"],
                        "label-sm": ["Inter"],
                        "headline-xl": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-bold": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "body-md": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "headline-lg": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "data-mono": ["13px", {"lineHeight": "1.2", "fontWeight": "400"}],
                        "label-sm": ["11px", {"lineHeight": "1.2", "fontWeight": "500"}],
                        "headline-xl": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "headline-md": ["18px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .form-radio-card:checked + label {
            border-color: #F39200;
            background-color: rgba(243, 146, 0, 0.05);
            box-shadow: 0 0 0 1px #F39200;
        }
        .form-radio-card:checked + label .check-icon {
            display: block;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-[#1C1F2B]/85 backdrop-blur-md dark:bg-slate-950/90 text-[#F39200] font-['Inter'] text-sm font-medium tracking-tight docked full-width top-0 z-50 border-b border-white/10 shadow-[0_4px_20px_rgba(0,0,0,0.15)] flex justify-between items-center w-full px-6 py-3 max-w-full">
<div class="flex items-center gap-2">
<span class="text-xl font-bold tracking-tighter text-white">SiPENA BPBD</span>
</div>
<nav class="hidden md:flex items-center gap-6">
<a class="text-white/70 hover:text-white transition-colors" href="#">Dashboard</a>
<a class="text-white/70 hover:text-white transition-colors" href="#">Map</a>
<a class="text-[#F39200] border-b-2 border-[#F39200] pb-1" href="#">Alerts</a>
</nav>
<div class="flex items-center gap-4">
<button class="hover:bg-white/5 transition-all duration-200 p-2 rounded-full text-white/70 active:scale-95">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<button class="hover:bg-white/5 transition-all duration-200 p-2 rounded-full text-white/70 active:scale-95">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow pt-navbar-height pb-20 px-4 md:px-0">
<div class="max-w-[700px] mx-auto mt-8 mb-12">
<!-- Progress Section -->
<div class="mb-10">
<div class="flex justify-between items-end mb-3">
<div>
<h1 class="font-headline-lg text-headline-lg mb-1">Laporan Karhutla</h1>
<p class="text-tertiary font-body-md">Detail Kejadian &amp; Informasi Lahan</p>
</div>
<span class="text-primary font-label-bold">LANGKAH 2 DARI 4</span>
</div>
<div class="w-full bg-surface-container-highest h-2 rounded-full overflow-hidden">
<div class="bg-primary-container h-full w-1/2 transition-all duration-500"></div>
</div>
</div>
<!-- Form Container -->
<form class="space-y-10">
<!-- 1. Kondisi Titik Api -->
<section>
<label class="font-label-bold text-label-bold text-on-surface mb-4 block">KONDISI TITIK API (HOTSPOT) *</label>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
<div class="relative">
<input checked="" class="sr-only form-radio-card" id="api_aktif" name="hotspot" type="radio"/>
<label class="flex flex-col items-center p-4 border border-outline-variant rounded-lg cursor-pointer transition-all hover:bg-surface-container" for="api_aktif">
<span class="material-symbols-outlined text-error mb-2" data-icon="local_fire_department" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-label-sm text-center">Api Masih Berkobar (Aktif)</span>
</label>
</div>
<div class="relative">
<input class="sr-only form-radio-card" id="api_berasap" name="hotspot" type="radio"/>
<label class="flex flex-col items-center p-4 border border-outline-variant rounded-lg cursor-pointer transition-all hover:bg-surface-container" for="api_berasap">
<span class="material-symbols-outlined text-tertiary mb-2" data-icon="air">air</span>
<span class="font-label-sm text-center">Api Sudah Padam, Berasap (Pendinginan)</span>
</label>
</div>
<div class="relative">
<input class="sr-only form-radio-card" id="api_padam" name="hotspot" type="radio"/>
<label class="flex flex-col items-center p-4 border border-outline-variant rounded-lg cursor-pointer transition-all hover:bg-surface-container" for="api_padam">
<span class="material-symbols-outlined text-primary mb-2" data-icon="task_alt">task_alt</span>
<span class="font-label-sm text-center">Api Sudah Padam Total</span>
</label>
</div>
</div>
</section>
<!-- 2. Jenis Lahan -->
<section>
<label class="font-label-bold text-label-bold text-on-surface mb-4 block">JENIS LAHAN YANG TERBAKAR *</label>
<div class="space-y-2">
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container transition-colors group">
<input checked="" class="w-5 h-5 text-primary border-outline focus:ring-primary-container" name="land_type" type="radio"/>
<span class="ml-4 font-body-md text-on-surface">Lahan Gambut</span>
</label>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container transition-colors group">
<input class="w-5 h-5 text-primary border-outline focus:ring-primary-container" name="land_type" type="radio"/>
<span class="ml-4 font-body-md text-on-surface">Lahan Mineral / Tanah Keras / Imbas Tumbang</span>
</label>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container transition-colors group">
<input class="w-5 h-5 text-primary border-outline focus:ring-primary-container" name="land_type" type="radio"/>
<span class="ml-4 font-body-md text-on-surface">Perkebunan Sawit / Karet</span>
</label>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container transition-colors group">
<input class="w-5 h-5 text-primary border-outline focus:ring-primary-container" name="land_type" type="radio"/>
<span class="ml-4 font-body-md text-on-surface">Hutan / Semak Belukar</span>
</label>
</div>
</section>
<div class="grid grid-cols-1 md:grid-cols-2 gap-10">
<!-- 3. Estimasi Luas -->
<section>
<label class="font-label-bold text-label-bold text-on-surface mb-4 block uppercase">Estimasi Luas (Hektar) *</label>
<div class="relative">
<input class="w-full p-4 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none bg-white font-data-mono text-headline-md" placeholder="0.00" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-tertiary font-label-sm">Ha</span>
</div>
</section>
<!-- 5. Jarak ke Pemukiman -->
<section>
<label class="font-label-bold text-label-bold text-on-surface mb-4 block uppercase">Jarak ke Pemukiman *</label>
<div class="flex gap-3">
<div class="flex-1">
<input checked="" class="sr-only form-radio-card" id="prox_near" name="proximity" type="radio"/>
<label class="flex items-center justify-center p-4 border border-outline-variant rounded-lg cursor-pointer transition-all text-center" for="prox_near">
<span class="font-label-sm">&lt; 500 Meter (Sangat Terancam)</span>
</label>
</div>
<div class="flex-1">
<input class="sr-only form-radio-card" id="prox_far" name="proximity" type="radio"/>
<label class="flex items-center justify-center p-4 border border-outline-variant rounded-lg cursor-pointer transition-all text-center" for="prox_far">
<span class="font-label-sm">&gt; 500 Meter</span>
</label>
</div>
</div>
</section>
</div>
<!-- 4. Pemilik Lahan -->
<section>
<label class="font-label-bold text-label-bold text-on-surface mb-4 block">PEMILIK LAHAN (Jika teridentifikasi) *</label>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container transition-colors">
<input checked="" class="w-5 h-5 text-primary border-outline focus:ring-primary-container" name="owner" type="radio"/>
<span class="ml-4 font-body-md text-on-surface">Milik Masyarakat / Perorangan</span>
</label>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container transition-colors">
<input class="w-5 h-5 text-primary border-outline focus:ring-primary-container" name="owner" type="radio"/>
<span class="ml-4 font-body-md text-on-surface">Milik Perusahaan (HGU)</span>
</label>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container transition-colors">
<input class="w-5 h-5 text-primary border-outline focus:ring-primary-container" name="owner" type="radio"/>
<span class="ml-4 font-body-md text-on-surface">Lahan Terbuka / Milik Negara</span>
</label>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container transition-colors">
<input class="w-5 h-5 text-primary border-outline focus:ring-primary-container" name="owner" type="radio"/>
<span class="ml-4 font-body-md text-on-surface">Belum Diketahui</span>
</label>
</div>
</section>
<!-- 6. Sumber Air -->
<section>
<label class="font-label-bold text-label-bold text-on-surface mb-4 block">SUMBER AIR UNTUK PEMADAMAN *</label>
<div class="space-y-2">
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container transition-colors">
<input checked="" class="w-5 h-5 text-primary border-outline focus:ring-primary-container" name="water" type="radio"/>
<span class="material-symbols-outlined ml-4 text-blue-500" data-icon="waves">waves</span>
<span class="ml-2 font-body-md text-on-surface">Tersedia di Lokasi (Kanal / Embong / Kolam)</span>
</label>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container transition-colors">
<input class="w-5 h-5 text-primary border-outline focus:ring-primary-container" name="water" type="radio"/>
<span class="material-symbols-outlined ml-4 text-tertiary" data-icon="distance">distance</span>
<span class="ml-2 font-body-md text-on-surface">Jauh dari Lokasi (Perlu Selang Panjang > 200 meter)</span>
</label>
<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container transition-colors">
<input class="w-5 h-5 text-primary border-outline focus:ring-primary-container" name="water" type="radio"/>
<span class="material-symbols-outlined ml-4 text-error" data-icon="block">block</span>
<span class="ml-2 font-body-md text-on-surface">Tidak Ada Sumber Air (Butuh Mobil Tangki)</span>
</label>
</div>
</section>
<!-- 7. Aksesibilitas -->
<section>
<label class="font-label-bold text-label-bold text-on-surface mb-4 block">AKSESIBILITAS LOKASI MENUJU TITIK API*</label>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
<div class="relative">
<input checked="" class="sr-only form-radio-card" id="acc_car" name="access" type="radio"/>
<label class="flex flex-col items-center p-4 border border-outline-variant rounded-lg cursor-pointer transition-all hover:bg-surface-container" for="acc_car">
<span class="material-symbols-outlined mb-2" data-icon="directions_car">directions_car</span>
<span class="font-label-sm text-center leading-tight">Bisa Dilalui Kendaraan Roda 4</span>
</label>
</div>
<div class="relative">
<input class="sr-only form-radio-card" id="acc_moto" name="access" type="radio"/>
<label class="flex flex-col items-center p-4 border border-outline-variant rounded-lg cursor-pointer transition-all hover:bg-surface-container" for="acc_moto">
<span class="material-symbols-outlined mb-2" data-icon="moped">moped</span>
<span class="font-label-sm text-center leading-tight">Hanya Bisa Dilalui Kendaraan Roda 2</span>
</label>
</div>
<div class="relative">
<input class="sr-only form-radio-card" id="acc_walk" name="access" type="radio"/>
<label class="flex flex-col items-center p-4 border border-outline-variant rounded-lg cursor-pointer transition-all hover:bg-surface-container" for="acc_walk">
<span class="material-symbols-outlined mb-2" data-icon="directions_walk">directions_walk</span>
<span class="font-label-sm text-center leading-tight">Hanya Bisa Ditempuh Jalan Kaki</span>
</label>
</div>
</div>
</section>
</form>
</div>
</main>
<!-- BottomNavBar -->
<footer class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] fixed bottom-0 left-0 w-full flex justify-between items-center h-20 px-8 z-50">
<button class="flex items-center gap-2 text-slate-500 dark:text-slate-400 font-['Inter'] text-[12px] font-semibold uppercase tracking-wider active:scale-90 transition-transform hover:text-[#F39200]">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
            Kembali
        </button>
<button class="bg-[#F39200] text-white px-8 py-3 rounded-lg font-['Inter'] text-[12px] font-semibold uppercase tracking-wider flex items-center gap-2 shadow-lg shadow-[#F39200]/20 active:scale-95 transition-all hover:brightness-110">
            Lanjut
            <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
</body></html>
